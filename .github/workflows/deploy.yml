name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shihab-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shihab-portfolio/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Firebase web config. Without these the deployed site falls back to
          # per-browser localStorage, so admin edits never reach visitors and
          # the sign-in form has nothing to authenticate against. Add them under
          # Settings -> Secrets and variables -> Actions. See FIREBASE_SETUP.md.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Legacy hash sign-in, used only when the Firebase values above are
          # absent. With Firebase configured the admin account lives in Firebase
          # Authentication and these are ignored, so they can be left unset.
          VITE_ADMIN_ID: ${{ secrets.VITE_ADMIN_ID }}
          VITE_ADMIN_PW_SALT: ${{ secrets.VITE_ADMIN_PW_SALT }}
          VITE_ADMIN_PW_HASH: ${{ secrets.VITE_ADMIN_PW_HASH }}
          VITE_ADMIN_PW_ITERATIONS: ${{ secrets.VITE_ADMIN_PW_ITERATIONS }}

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: shihab-portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
